name: arena-progression-platform

services:
  # Credentials come from the ignored .env file (see .env.example)
  # The healthcheck waits until the arena user can authenticate
  mysql:
    image: mysql:8.4.11
    container_name: arena-mysql
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # PLAINTEXT (9092) is for host apps
  # INTERNAL (29092) is for other containers like Kafbat
  # Replication factors are 1 because this is a single-broker local setup
  kafka:
    image: apache/kafka:4.3.1
    container_name: arena-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.10
    container_name: arena-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional inspection UIs - start with: docker compose --profile tools up -d
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: arena-kafbat
    profiles: [ "tools" ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Optional inspection UIs - start with: docker compose --profile tools up -d
  redis-insight:
    image: redis/redisinsight:3.8.0
    container_name: arena-redis-insight
    profiles: [ "tools" ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "yes"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  kafka_data:
  redis_data:
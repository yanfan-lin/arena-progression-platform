# Keep ordinary tests independent of Kafka,
# existing tests boot the context without starting a broker
spring:
  kafka:
    consumer:
      group-id: progression-platform-test
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.yanfan.arena.contract
        spring.json.value.default.type: com.yanfan.arena.contract.ArenaMatchCompleted

    listener:
      ack-mode: record
      concurrency: 1
      auto-startup: false

    admin:
      auto-create: false

arena:
  cache:
    # Default player cache lifetime for tests
    player-profile-ttl: 10m

  leaderboard:
    # Prevent background rebuilds from changing unrelated integration tests
    rebuild-enabled: false

server:
  port: ${PROGRESSION_SERVER_PORT:8081}

spring:
  # Schema is created and versioned by Flyway
  # Hibernate only validates that the entity mapping
  # matches the migration
  jpa:
    hibernate:
      ddl-auto: validate

  application:
    name: progression-platform
  # Values can be overridden so the same app runs against Docker compose
  # and Testcontainers in tests
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/arena}
    username: ${MYSQL_USER:arena}
    password: ${MYSQL_PASSWORD:change-me}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:progression-platform}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.yanfan.arena.contract
        spring.json.value.default.type: com.yanfan.arena.contract.ArenaMatchCompleted
    listener:
      # Commit after each record succeeds
      ack-mode: record
      concurrency: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

arena:
  leaderboard:
    # Rebuild Redis automatically after startup or failure
    rebuild-enabled: ${LEADERBOARD_REBUILD_ENABLED:true}

    # Wait this long before retrying a failed rebuild
    rebuild-retry-delay: ${LEADERBOARD_REBUILD_RETRY_DELAY:30s}

  cache:
    # Remove cached player profiles after ten minutes
    player-profile-ttl: ${PLAYER_PROFILE_CACHE_TTL:10m}

logging:
  pattern:
    # Include request or Kafka details when they are available
    level: "%5p %X"

management:
  endpoints:
    web:
      # Expose health, Redis rebuild info and application metrics
      exposure:
        include: health, info, metrics
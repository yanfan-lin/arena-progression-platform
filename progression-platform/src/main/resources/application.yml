spring:
  application:
    name: progression-platform
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/arena}
    username: ${MYSQL_USER:arena}
    password: ${MYSQL_PASSWORD:change-me}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:progression-platform}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
# 8081 is the local default
server:
  port: ${PROGRESSION_SERVER_PORT:8081}

spring:
  # Schema is created and versioned by Flyway
  # Hibernate only validates that the entity mapping
  # matches the migration
  jpa:
    hibernate:
      ddl-auto: validate

  mvc:
    problemdetails:
      enabled: true

  application:
    name: progression-platform
  # Values can be overridden so the same app runs against Docker compose
  # and Testcontainers in tests
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/arena}
    username: ${MYSQL_USER:arena}
    password: ${MYSQL_PASSWORD:change-me}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:progression-platform}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0;
            text-align: center;
        }

        .subtitle {
            margin: 8px 0 32px;
            text-align: center;
            color: #6b7280;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .controls div {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }

        th {
            background: #f9fafb;
        }

        #status {
            margin: 16px 0 0;
            text-align: right;
            color: #6b7280;
        }

        @media (max-width: 650px) {
            .controls {
                grid-template-columns: 1fr;
            }

            main {
                padding: 20px;
            }
        }
    </style>

    <title>Arena Progression Platform</title>
</head>

<body>

<main>
    <h1>Arena Leaderboard</h1>
    <p class="subtitle">Refreshes every 2 seconds</p>

    <section class="controls" aria-label="Leaderboard controls">

        <div>
            <label for="mode">Mode</label>

            <select id="mode">
                <option value="THREE_VS_THREE">3v3</option>
                <option value="FIVE_VS_FIVE">5v5</option>
            </select>
        </div>

        <div>
            <label for="metric">Rank by</label>

            <select id="metric">
                <option value="RATING">Rating</option>
                <option value="WINS">Wins</option>
                <option value="WIN_RATE">Win Rate</option>
            </select>
        </div>

        <div>
            <label for="limit">Limit</label>

            <select id="limit">
                <option value="10">TOP 10</option>
                <option value="30">TOP 30</option>
                <option value="50">TOP 50</option>
                <option value="100">TOP 100</option>
            </select>
        </div>

    </section>

    <table>
        <thead>
        <tr>
            <th scope="col">Rank</th>
            <th scope="col">Team</th>
            <th scope="col">Rating</th>
            <th scope="col">Wins</th>
            <th scope="col">Losses</th>
            <th scope="col">Win Rate</th>
        </tr>
        </thead>

        <tbody id="leaderboard-body">
        <tr>
            <td colspan="6">Leaderboard data will appear here</td>
        </tr>
        </tbody>
    </table>

    <p id="status" aria-live="polite">Loading leaderboard</p>

</main>

<script>

    const modeSelect = document.querySelector("#mode");

    const metricSelect = document.querySelector("#metric");

    const limitSelect = document.querySelector("#limit");

    const leaderboardBody = document.querySelector("#leaderboard-body");

    const status = document.querySelector("#status");

    function renderLeaderboard(entries) {

        leaderboardBody.replaceChildren();

        if (entries.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 6;
            cell.textContent = "No active teams found";

            row.append(cell);
            leaderboardBody.append(row);

            return;
        }

        for (const entry of entries) {

            const row = document.createElement("tr");

            const values = [
                entry.rank,
                entry.teamName,
                entry.rating,
                entry.wins,
                entry.losses,
                `${entry.winRate.toFixed(1)}%`
            ];

            for (const value of values) {
                const cell = document.createElement("td");

                cell.textContent = value;
                row.append(cell);
            }

            leaderboardBody.append(row);
        }
    }

    async function loadLeaderboard() {

        const parameters = new URLSearchParams({
            mode: modeSelect.value,
            metric: metricSelect.value,
            limit: limitSelect.value
        });

        try {
            const response = await fetch(
                    `/api/v1/leaderboards/teams?${parameters}`
            );

            if (!response.ok) {
                throw new Error("Leaderboard request failed");
            }

            const leaderboard = await response.json();

            renderLeaderboard(leaderboard.entries);

            const formattedTime = new Date().toLocaleString("en-US", {
                month: "short",
                day: "numeric",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            });

            status.textContent = `Last updated: ${formattedTime}`;
        }
        catch {
            status.textContent = "Leaderboard temporarily unavailable";
        }
    }

    document.querySelector(".controls")
            .addEventListener("change", loadLeaderboard);

    loadLeaderboard();

    setInterval(loadLeaderboard, 2_000);
</script>

</body>
</html>
